[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "duty-of-care-screenplay"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.141,<0.142", "google-adk[gcp]>=2.7,<3", "google-cloud-discoveryengine>=0.13.12,<0.14", "google-genai>=2.12,<3", "google-cloud-aiplatform[agent_engines]>=1.153,<2", "httpx>=0.28,<0.29", "pydantic>=2.12,<3", "uvicorn[standard]>=0.41,<0.42", "psycopg[binary]>=3.3,<4", "replit-object-storage>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
