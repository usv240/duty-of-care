name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest==9.0.2 ruff==0.15.6 playwright==1.55.0
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m scripts.visual_check --no-shots
      - run: docker build -t duty-of-care:${{ github.sha }} .
